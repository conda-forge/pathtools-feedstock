{% set name = "pathtools" %}
{% set version = "0.1.2" %}
{% set hash = "7c35c5421a39bb82e58018febd90e3b6e5db34c5443aaaf742b3f33d4655f1c0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ hash }}

build:
  noarch: python
  number: 2
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - pathtools

about:
  home: https://github.com/gorakhargosh/pathtools
  license: MIT
  license_file: LICENSE
  summary: Path utilities for Python.
  description: |
    Python API library for common path and pattern functionality.
  doc_url: http://pythonhosted.org/pathtools

extra:
  recipe-maintainers:
    - goanpeca
